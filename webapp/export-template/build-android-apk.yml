name: Exportar juego a APK Android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Instalar Android SDK
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Preparar proyecto del juego
        run: |
          test -s mobiforge-project.zip
          mkdir game-src
          unzip -q mobiforge-project.zip -d game-src
          cd game-src
          npm install
          npm run build
          NAME=$(node -e "const p=require('./public/game.json');console.log((p.name||'Juego').replace(/[^A-Za-z0-9 ]/g,'').trim().slice(0,28)||'Juego')")
          SLUG=$(node -e "const p=require('./public/game.json');console.log((p.name||'juego').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,'.').replace(/^\\.|\\.$/g,'').slice(0,24)||'juego')")
          npm install --global cordova@12
          cordova create "$GITHUB_WORKSPACE/cordova" "com.mobiforge.game.${SLUG}" "$NAME"
          cp -R dist/. "$GITHUB_WORKSPACE/cordova/www/"
          cd "$GITHUB_WORKSPACE/cordova"
          cordova platform add android@13.0.0
          cordova build android --debug
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist-apk/${SLUG}-debug.apk"
      - name: Verificar APK
        run: test -s dist-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Juego-Android-APK
          path: dist-apk/*.apk
          retention-days: 30
