name: Build MobiForge 3D HTML Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Package HTML editor for Android
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package.json

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Bundle HTML, Three.js and Lua runtime
        working-directory: webapp
        run: |
          npm install
          npm run build

      - name: Create Cordova Android shell
        run: |
          npm install --global cordova@12
          cordova create cordova com.blopex.mobiforge3d "MobiForge 3D"
          cat > cordova/config.xml <<'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.blopex.mobiforge3d" version="0.2.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>MobiForge 3D</name>
            <description>Editor 3D móvil con interfaz HTML, gizmos táctiles y scripts Lua.</description>
            <content src="index.html" />
            <access origin="*" />
            <allow-intent href="https://*/*" />
            <preference name="Orientation" value="landscape" />
            <preference name="Fullscreen" value="true" />
            <preference name="AndroidXEnabled" value="true" />
            <preference name="DisallowOverscroll" value="true" />
          </widget>
          XML
          rm -rf cordova/www/*
          cp -R webapp/dist/. cordova/www/
          cd cordova
          cordova platform add android@13.0.0
          cordova build android --debug

      - name: Verify Android package
        run: |
          APK="cordova/platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobiForge3D-HTML-Android-APK
          path: cordova/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
